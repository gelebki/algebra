<style>
/* Układ: zeszyt w kratkę — sticky pasek gracza, zakładki list, ścieżka poziomów, karta zadania z klawiaturą */
:root {
  /* grafit + jeden ciepły akcent; kolory list tylko jako drobne znaczniki */
  --bg: #121214; --surface: #1a1a1e; --surface-2: #222227; --ink: #ececef; --muted: #a1a1aa; --line: #2e2e35;
  --accent: #f0b65a; --accent-ink: #1a1408; --accent-soft: rgba(240, 182, 90, .12);
  --brand: var(--accent); --brand-ink: var(--accent-ink); --brand-soft: var(--accent-soft);
  --xp: #f0b65a; --xp-soft: rgba(240, 182, 90, .12);
  --ok: #62cf96; --ok-bg: rgba(98, 207, 150, .09);
  --bad: #8d8d98; --bad-bg: rgba(255, 255, 255, .03);
  --l1: #6cc4ad; --l2: #e39b88; --l3: #ac9ee3; --hue: var(--accent);
  --shadow: 0 10px 28px -18px rgba(0, 0, 0, .75);
  --f-display: "Inter Tight", "Inter", "Segoe UI", system-ui, sans-serif;
  --f-body: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 12px; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background-color: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-body);
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2.5px solid var(--brand); outline-offset: 2px; border-radius: 8px; }
.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); letter-spacing: -.01em; text-wrap: balance; margin: 0; }
.muted { color: var(--muted); }
mjx-container { display: inline-block; max-width: 100%; }
mjx-container[display="true"] { display: block; overflow-x: auto; overflow-y: hidden; padding: 4px 0; margin: 6px 0 !important; }
mjx-container svg { max-width: none; }
.tex-fallback { font-family: var(--f-mono); font-size: .9em; color: var(--muted); }

/* ---------- pasek gracza ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 14px; padding-block: 10px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); background: none; border: 0; padding: 0; }
.logo b { font-family: var(--f-display); font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
.logo svg { width: 30px; height: 30px; flex: none; }
.spacer { flex: 1; }
.player { display: flex; align-items: center; gap: 12px; min-width: 0; }
.lvl { position: relative; width: 42px; height: 42px; flex: none; display: grid; place-items: center; font: 800 15px var(--f-display); }
.lvl svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.xpbox { display: grid; gap: 3px; min-width: 120px; }
.xpbox .t { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; white-space: nowrap; }
.xpbox .t b { color: var(--ink); font-weight: 600; }
.xpbox .t { min-width: 0; } .xpbox .t b { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.xpbox { max-width: 260px; }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--xp), color-mix(in srgb, var(--xp) 60%, #fff)); transition: width .8s cubic-bezier(.2, .8, .2, 1); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 13px; white-space: nowrap; }
.chip svg { width: 16px; height: 16px; }
.chip.flame { color: var(--xp); }
.chip.solved { color: var(--ok); }
.iconbtn { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.iconbtn svg { width: 18px; height: 18px; }
.iconbtn:hover { border-color: var(--brand); }

/* ---------- zakładki ---------- */
.tabs { display: flex; gap: 8px; padding-block: 14px 6px; overflow-x: auto; scrollbar-width: none; }
.tab { flex: 1 1 0; min-width: max-content; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); text-align: left; transition: transform .15s, border-color .15s, box-shadow .15s; }
.tab:hover { border-color: #45454f; }
.tab[aria-selected="true"] { border-color: color-mix(in srgb, var(--hue) 70%, var(--line)); background: var(--surface-2); }
.tab .num { font: 800 18px var(--f-display); color: var(--hue); }
.tab .lbl { display: grid; line-height: 1.2; }
.tab .lbl small { color: var(--muted); font-size: 12px; }
.tab .ring { width: 30px; height: 30px; flex: none; }
.h-l1 { --hue: var(--l1); } .h-l2 { --hue: var(--l2); } .h-l3 { --hue: var(--l3); } .h-st { --hue: var(--accent); }

/* ---------- widok listy ---------- */
.hero { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: end; padding: 20px 0 8px; }
.hero h1 { font-size: clamp(26px, 5vw, 40px); font-weight: 800; line-height: 1.05; }
.hero h1 span { color: var(--hue); }
.hero p { margin: 8px 0 0; max-width: 60ch; color: var(--muted); }
.hero .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 600; transition: background .15s, border-color .15s, filter .15s; }
.btn svg { width: 18px; height: 18px; }
.btn:hover { border-color: #4a4a54; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn.small { padding: 7px 12px; font-size: 13px; border-radius: 10px; }

.listbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 6px 0 4px; font-size: 13px; color: var(--muted); }
.listbar .bar { flex: 1; min-width: 160px; height: 10px; }
.listbar .bar i { background: var(--hue); }

.path { position: relative; display: grid; gap: 10px; padding: 26px 0 60px; }
.path svg.trail { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.node { position: relative; display: flex; align-items: center; gap: 16px; width: min(440px, 100%); padding: 10px 16px 10px 10px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); text-align: left; box-shadow: var(--shadow); transition: transform .18s, border-color .18s; animation: pop .45s backwards cubic-bezier(.2, .9, .3, 1.3); }
.node:hover { transform: translateY(-1px); border-color: #45454f; }
.node.left { justify-self: start; } .node.right { justify-self: end; } .node.mid { justify-self: center; }
.node .disc { position: relative; width: 64px; height: 64px; flex: none; display: grid; place-items: center; }
.node .disc svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.node .disc b { font: 800 17px var(--f-display); color: var(--hue); }
.node.done .disc b { color: var(--ink); }
.node .meta { min-width: 0; display: grid; gap: 2px; }
.node .meta h3 { font-size: 16px; font-weight: 700; line-height: 1.25; }
.node .meta small { color: var(--muted); font-size: 12.5px; }
.stars { display: inline-flex; gap: 2px; }
.stars svg { width: 16px; height: 16px; }
.stars .on { color: var(--xp); } .stars .off { color: var(--line); }
@keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.96); } }

/* ---------- widok zadania ---------- */
.taskhead { display: flex; align-items: center; gap: 12px; padding: 16px 0 8px; flex-wrap: wrap; }
.taskhead h2 { font-size: clamp(20px, 3.6vw, 28px); font-weight: 800; }
.taskhead h2 span { color: var(--hue); }
.statement { border: 1px dashed var(--line); border-radius: var(--r); padding: 10px 14px; background: var(--surface-2); color: var(--muted); font-size: 14px; }
.statement summary { cursor: pointer; font-weight: 600; color: var(--ink); }
.dots { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0; }
.dot { min-width: 34px; height: 30px; padding: 0 8px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font: 600 12px var(--f-mono); color: var(--muted); }
.dot.cur { border-color: var(--hue); color: var(--ink); box-shadow: 0 0 0 3px color-mix(in srgb, var(--hue) 20%, transparent); }
.dot.gold { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.dot.silver { background: var(--xp-soft); border-color: var(--xp); color: var(--xp); }
.dot.burn { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }

.card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: clamp(16px, 3vw, 26px); animation: slidein .35s cubic-bezier(.2, .8, .2, 1); }
@keyframes slidein { from { opacity: 0; transform: translateX(18px); } }
.card.shake { animation: shake .45s; }
@keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
.card .kicker { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin-bottom: 8px; }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 99px; font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; font-weight: 700; background: var(--brand-soft); color: var(--brand); }
.badge.var { background: var(--xp-soft); color: var(--xp); }
.badge.q { background: color-mix(in srgb, var(--hue) 14%, transparent); color: var(--hue); }
.question { font-size: 16.5px; line-height: 1.65; overflow-wrap: anywhere; }
.question mjx-container[display="true"] { font-size: 112%; }

.fields { display: grid; gap: 12px; margin-top: 16px; }
.field { display: grid; grid-template-columns: minmax(70px, auto) 1fr; gap: 10px 12px; align-items: start; }
.field > label { padding-top: 10px; font-weight: 600; text-align: right; white-space: nowrap; }
.field .inbox { min-width: 0; display: grid; gap: 4px; }
.field input { width: 100%; min-width: 0; padding: 11px 40px 11px 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface-2); color: var(--ink); font: 500 16px var(--f-mono); transition: border-color .15s, box-shadow .15s; }
.field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--hue) 18%, transparent); background: var(--surface); }
.field .inwrap { position: relative; }
.field .mark { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; }
.field.ok input { border-color: var(--ok); background: var(--ok-bg); }
.field.bad input { border-color: var(--bad); background: var(--bad-bg); }
.preview { min-height: 22px; font-size: 14px; color: var(--muted); overflow-x: auto; overflow-y: hidden; }
.preview.err { color: var(--bad); font-size: 13px; }
.field .yn { display: inline-flex; border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface-2); }
.field .yn button { border: 0; background: transparent; padding: 9px 18px; font-weight: 600; color: var(--muted); }
.field .yn button[aria-pressed="true"] { background: var(--hue); color: var(--brand-ink); }
.field.ok .yn { border-color: var(--ok); } .field.bad .yn { border-color: var(--bad); }

.keypad { margin-top: 10px; display: grid; gap: 6px; grid-template-columns: repeat(7, minmax(0, 1fr)); max-width: 560px; user-select: none; }
.keypad button { height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font: 500 15px var(--f-body); display: grid; place-items: center; transition: background .1s, transform .08s; padding: 0 4px; }
.keypad button:hover { border-color: var(--hue); }
.keypad button:active { transform: scale(.94); background: var(--brand-soft); }
.keypad .num { background: var(--surface); font-family: var(--f-mono); font-weight: 600; }
.keypad .fn { font-size: 13px; color: var(--hue); font-weight: 600; }
.keypad .ctl { color: var(--muted); }
.keypad .wide { grid-column: span 2; }
.kp-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 14px; font-size: 12.5px; color: var(--muted); }
.kp-head button { border: 0; background: none; color: var(--brand); font-weight: 600; font-size: 12.5px; padding: 4px; }

.choices { display: grid; gap: 8px; margin-top: 16px; }
.opt { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface-2); text-align: left; min-width: 0; transition: border-color .12s, background .12s; }
.opt .box { width: 22px; height: 22px; flex: none; border-radius: 7px; border: 2px solid var(--line); display: grid; place-items: center; }
.opt.single .box { border-radius: 50%; }
.opt[aria-pressed="true"] { border-color: var(--hue); background: color-mix(in srgb, var(--hue) 9%, var(--surface)); }
.opt[aria-pressed="true"] .box { background: var(--hue); border-color: var(--hue); }
.opt[aria-pressed="true"] .box::after { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--brand-ink); }
.opt .txt { min-width: 0; overflow-x: auto; }
.opt.ok { border-color: var(--ok); background: var(--ok-bg); } .opt.bad { border-color: var(--bad); background: var(--bad-bg); }

.order { display: grid; gap: 14px; margin-top: 16px; }
.order h4 { margin: 0 0 6px; font: 600 12px var(--f-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.proof, .pool { display: grid; gap: 8px; min-height: 54px; padding: 8px; border-radius: 14px; border: 1.5px dashed var(--line); }
.proof:empty::before { content: "Klikaj kroki poniżej w odpowiedniej kolejności…"; color: var(--muted); font-size: 13px; padding: 8px; }
.step { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); text-align: left; font-size: 14.5px; min-width: 0; animation: pop .25s; }
.step .n { flex: none; width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; font: 700 12px var(--f-mono); background: var(--brand-soft); color: var(--brand); }
.step .tx { min-width: 0; overflow-x: auto; }
.step:hover { border-color: var(--hue); }
.step.ok { border-color: var(--ok); background: var(--ok-bg); } .step.bad { border-color: var(--bad); background: var(--bad-bg); }

.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 18px; }
.actions .life { display: flex; gap: 8px; flex-wrap: wrap; }
.life .btn { border-style: dashed; }
.life .btn.used { border-style: solid; background: var(--xp-soft); border-color: var(--xp); color: var(--xp); }

.feedback { margin-top: 18px; border-radius: 16px; padding: 16px 18px; animation: pop .35s; }
.feedback.ok { background: var(--ok-bg); border: 1px solid var(--ok); }
.feedback.bad, .feedback.learn { background: var(--surface-2); border: 1px solid var(--line); }
.feedback.learn h3 { color: var(--ink); } .feedback.learn h3 span { color: var(--accent); }
.feedback h3 { font-size: 20px; display: flex; align-items: center; gap: 10px; }
.feedback.ok h3 { color: var(--ok); } .feedback.bad h3 { color: var(--bad); }
.feedback .ans { display: grid; gap: 6px; margin: 10px 0; }
.feedback .ans div { overflow-x: auto; }
.feedback ol { margin: 8px 0; padding-left: 22px; display: grid; gap: 6px; }
.feedback .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

/* ---------- panele ---------- */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(10, 14, 30, .45); backdrop-filter: blur(2px); animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.drawer { position: fixed; z-index: 41; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: var(--surface); border-left: 1px solid var(--line); box-shadow: -20px 0 60px -20px rgba(0, 0, 0, .35); display: flex; flex-direction: column; animation: drawer .32s cubic-bezier(.2, .8, .2, 1); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
@keyframes drawer { from { transform: translateX(100%); } }
.drawer header { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.drawer header h3 { font-size: 20px; flex: 1; }
.drawer .body { overflow-y: auto; padding: 16px 18px 30px; display: grid; gap: 12px; align-content: start; }
.formula { padding: 10px 14px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); overflow-x: auto; }
.exq { overflow-x: auto; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); }
.exstep { display: flex; gap: 10px; padding: 10px 12px; border-radius: 12px; border-left: 3px solid var(--hue); background: var(--surface-2); animation: pop .3s; min-width: 0; }
.exstep > div { min-width: 0; overflow-x: auto; }
.exstep .n { flex: none; font: 700 12px var(--f-mono); color: var(--hue); padding-top: 3px; }

.modal { position: fixed; z-index: 42; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(420px, calc(100% - 32px)); background: var(--surface); border-radius: 24px; border: 1px solid var(--line); box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .5); padding: 28px 24px 22px; text-align: center; animation: modal .45s cubic-bezier(.2, .9, .3, 1.4); }
@keyframes modal { from { opacity: 0; transform: translate(-50%, -40%) scale(.85); } }
.modal h2 { font-size: 28px; font-weight: 800; }
.modal p { color: var(--muted); margin: 8px 0 18px; }
.modal .big { font: 800 64px/1 var(--f-display); color: var(--xp); margin: 6px 0; }
.modal .stars svg { width: 40px; height: 40px; }
.modal .stars svg { animation: starpop .5s backwards cubic-bezier(.2, .9, .3, 1.6); }
.modal .stars svg:nth-child(2) { animation-delay: .15s; } .modal .stars svg:nth-child(3) { animation-delay: .3s; }
@keyframes starpop { from { transform: scale(0) rotate(-40deg); } }
.modal .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

.toasts { position: fixed; z-index: 50; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; width: min(380px, calc(100% - 32px)); pointer-events: none; }
.toast { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: var(--ink); color: var(--bg); box-shadow: var(--shadow); animation: toast .4s cubic-bezier(.2, .9, .3, 1.3); }
.toast svg { width: 28px; height: 28px; color: var(--xp); flex: none; }
.toast b { display: block; }
@keyframes toast { from { opacity: 0; transform: translateY(20px) scale(.95); } }
.xpfloat { position: fixed; z-index: 60; pointer-events: none; font: 800 22px var(--f-display); color: var(--xp); text-shadow: 0 2px 10px rgba(0, 0, 0, .15); animation: floatup 1.3s forwards cubic-bezier(.2, .8, .2, 1); }
@keyframes floatup { to { opacity: 0; transform: translateY(-70px) scale(1.2); } }
canvas.fx { position: fixed; inset: 0; z-index: 55; pointer-events: none; }

/* ---------- statystyki ---------- */
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 18px 0; }
.mecard { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 14px; padding: 16px 18px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); margin: 14px 0 16px; }
.mecard .av { width: 48px; height: 48px; font-size: 16px; }
